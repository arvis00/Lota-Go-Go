<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1430">
<title>Lota Go</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="toast" class="toast"><span id="toastMain"></span><span id="toastSub"></span></div>

  <!-- ===== HUD ===== -->
  <div id="hud" class="layer hidden">
    <div class="hud-top">
      <div class="hud-bones"><span class="bone-ico"></span><span id="hudBones">0</span><span class="hud-sub">/15</span></div>
      <div class="hud-zone"><div id="hudZone">Namai</div>
        <div class="hud-bar"><div id="hudBarFill"></div></div>
      </div>
      <button id="btnPause" class="icon-btn" aria-label="Pauzė">II</button>
    </div>
    <div id="tut" class="tut">
      <div class="tut-row"><b id="tutUp">↑ / W</b><span>šokti</span></div>
      <div class="tut-row"><b id="tutDown">↓ / S</b><span>pasilenkti</span></div>
    </div>
    <div id="touchpad" class="touchpad">
      <button id="btnUp" class="tbtn" aria-label="Šokti">▲</button>
      <button id="btnDown" class="tbtn" aria-label="Pasilenkti">▼</button>
    </div>
  </div>

  <!-- ===== LOBBY (one page per level, slid sideways) ===== -->
  <div id="screen-lobby" class="layer screen hidden">
    <div class="logo">
      <div class="logo-main">LOTA <span>GO</span></div>
      <div id="lobbySub" class="logo-sub">Didysis Lotos nuotykis</div>
    </div>
    <div class="lobby-spacer"></div>
    <div id="lobbyLock" class="lock-note hidden"></div>
    <div class="lobby-actions">
      <button id="btnPlay" class="big-btn play">ŽAISTI</button>
      <button id="btnSkins" class="big-btn alt">APRANGOS</button>
    </div>
    <div class="lobby-foot">
      <div id="lobbyWallet" class="wallet"></div>
      <div id="lobbyBest" class="best"></div>
      <button id="btnSound" class="icon-btn round" aria-label="Garsas">♪</button>
    </div>
    <button id="btnPagePrev" class="page-arrow left" aria-label="Ankstesnis lygis">‹</button>
    <button id="btnPageNext" class="page-arrow right" aria-label="Kitas lygis">›</button>
    <div id="lobbyDots" class="page-dots"></div>
  </div>

  <!-- ===== LEVEL PICTURE (levels with no arena yet) ===== -->
  <div id="screen-preview" class="layer screen hidden">
    <div class="preview-head">
      <button id="btnPreviewBack" class="icon-btn">‹</button>
      <div class="preview-title">
        <h2 id="previewName"></h2>
        <div id="previewSub" class="preview-sub"></div>
      </div>
    </div>
    <div class="lobby-spacer"></div>
    <div class="preview-note">
      <div class="preview-tag">NUOTRAUKA</div>
      <div id="previewNote"></div>
    </div>
    <div class="lobby-actions">
      <button id="btnPreviewSkins" class="big-btn alt">ŠIO LYGIO APRANGOS</button>
    </div>
  </div>

  <!-- ===== SKINS ===== -->
  <div id="screen-skins" class="layer screen hidden">
    <div class="sheet">
      <div class="sheet-head">
        <button id="btnSkinsBack" class="icon-btn">‹</button>
        <h2 id="skinsTitle">Aprangos</h2>
        <div id="skinsWallet" class="wallet small"></div>
      </div>
      <div id="skinGrid" class="skin-grid"></div>
    </div>
  </div>

  <!-- ===== GAME OVER ===== -->
  <div id="screen-over" class="layer screen dim hidden">
    <div class="panel">
      <div class="panel-title">GAME OVER</div>
      <div id="overSub" class="panel-sub"></div>
      <div id="overStats" class="stats"></div>
      <button id="btnRetry" class="big-btn play">Bandyti iš naujo</button>
      <button id="btnLobby" class="big-btn alt">Baigti ir atsiimti</button>
    </div>
  </div>

  <!-- ===== WIN ===== -->
  <div id="screen-win" class="layer screen dim hidden">
    <div class="panel win">
      <div class="panel-title">FINIŠAS!</div>
      <div id="winSub" class="panel-sub">Lota pasiekė Londoną!</div>
      <div id="winStats" class="stats"></div>
      <button id="btnWinAgain" class="big-btn play">Dar kartą</button>
      <button id="btnWinLobby" class="big-btn alt">Grįžti į Lobby</button>
    </div>
  </div>

  <!-- ===== PAUSE ===== -->
  <div id="screen-pause" class="layer screen dim hidden">
    <div class="panel">
      <div class="panel-title small">PAUZĖ</div>
      <button id="btnResume" class="big-btn play">Tęsti</button>
      <button id="btnPauseLobby" class="big-btn alt">Grįžti į Lobby</button>
    </div>
  </div>
</div>

<script src="js/util.js"></script>
<script src="js/lota.js"></script>
<script src="js/props.js"></script>
<script src="js/zones.js"></script>
<script src="js/levels.js"></script>
<script src="js/level.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
