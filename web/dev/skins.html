<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<title>Lota Go — aprangų lentyna</title>
<style>
  body{margin:0;background:#1a1230;color:#fff;font:600 13px/1.3 system-ui,sans-serif}
  h1{font-size:16px;padding:14px 16px 0;margin:0}
  p{padding:2px 16px 12px;margin:0;opacity:.6;font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;padding:0 12px 24px}
  .cell{background:rgba(255,255,255,.06);border-radius:16px;padding:8px}
  .cell b{display:block;margin-bottom:4px}
  .cell span{opacity:.6;font-weight:400}
  canvas{width:100%;display:block;border-radius:12px;background:rgba(0,0,0,.22)}
</style>
</head>
<body>
<h1>Aprangų lentyna</h1>
<p>Kiekviena apranga keturiose pozose: sėdi · bėga · šoka · pasilenkusi. Žaidimas šio puslapio neįkelia.</p>
<div class="grid" id="grid"></div>
<script src="../js/util.js"></script>
<script src="../js/lota.js"></script>
<script>
const W = 520, H = 170, dpr = Math.min(devicePixelRatio || 1, 2);
const poses = [
  { state: 'sit',  face: 'calm',  x: 62 },
  { state: 'run',  face: 'happy', x: 190 },
  { state: 'jump', face: 'wow',   x: 320 },
  { state: 'duck', face: 'happy', x: 448 }
];
const grid = document.getElementById('grid');
const cvs = [];
SKINS.forEach(sk => {
  const cell = document.createElement('div');
  cell.className = 'cell';
  const cost = sk.cost ? [(sk.cost.b ? sk.cost.b + '🦴' : ''), (sk.cost.t ? sk.cost.t + '🧸' : '')].filter(Boolean).join(' + ') : 'boso prizas';
  cell.innerHTML = '<b>' + sk.name + ' <span>· ' + sk.level + ' lygis · ' + cost + '</span></b>';
  const cv = document.createElement('canvas');
  cv.width = W * dpr; cv.height = H * dpr;
  cell.appendChild(cv); grid.appendChild(cell);
  cvs.push({ cv: cv, c: cv.getContext('2d'), id: sk.id });
});
function frame(ts) {
  const t = ts / 1000;
  cvs.forEach(o => {
    const c = o.c;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    poses.forEach(p => {
      drawLota(c, p.x, H - 24, { state: p.state, t: t, run: t * 11, skin: o.id, scale: 1.5, face: p.face });
    });
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
